services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      FRONTEND_URL: ${FRONTEND_URL:-http://161.118.185.230}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:3000"
      - "8080:3000"
    environment:
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://backend:5001}
    depends_on:
      - backend
